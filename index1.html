<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新知记 · AI 智能结构化学习空间</title>
<style>
:root{
  --brand:#FF2E4D;
  --brand-soft:#FFEDF0;
  --paper:#2E6BFF;      /* 权威文献 */
  --paper-soft:#EAF1FF;
  --note:#FF9500;       /* 个人笔记 */
  --note-soft:#FFF4E5;
  --light:#A15BFF;      /* 强调色（缺口/迁移） */
  --light-soft:#F3EBFF;
  --ok:#06C270;
  --ok-soft:#E4F9EE;
  --warn:#FF8A00;
  /* 清亮辅助色：只用于「编码信息层级」，不作装饰 */
  --sky:#2F7CF6;        /* AI 产品与大模型 */
  --sky-soft:#E9F1FE;
  --violet:#7C5CFF;     /* 产品经理 */
  --violet-soft:#F0ECFF;
  --mint:#06C270;       /* 营养健康 */
  --mint-soft:#E4F9EE;
  --cyan:#16D6C1;       /* 深色卡上的高亮：进度环与选中态 */
  --amber:#FFB020;
  --coral:#FF6B6B;
  --bg:#F4F5F7;
  --card:#FFFFFF;
  --t1:#14161A;
  --t2:#5A616E;
  --t3:#9AA1AE;
  --line:#EDEFF2;
  /* 圆角只留三档，阴影只留两档：同屏元素的轮廓语言保持一致 */
  --r-l:16px;
  --r-m:12px;
  --r-s:8px;
  --shadow:0 1px 3px rgba(20,22,26,.04),0 4px 16px rgba(20,22,26,.045);
  --shadow-up:0 -4px 20px rgba(20,22,26,.09);
  /* 中性底：用来替代大量彩色标签底 */
  --fill:#F4F5F7;
  --fill-2:#FAFBFC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#0E1013;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 12px;
  color:var(--t1);
}
/* ============ 手机外壳 ============ */
.phone{
  width:390px;height:844px;
  background:var(--bg);
  border-radius:46px;
  position:relative;
  box-shadow:0 0 0 11px #1C1F24, 0 0 0 13px #33373F, 0 30px 70px rgba(0,0,0,.6);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.notch{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:118px;height:30px;background:#1C1F24;border-radius:16px;z-index:999;
}
.statusbar{
  height:48px;flex:0 0 48px;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px 4px;font-size:13px;font-weight:600;color:var(--t1);
  background:transparent;z-index:50;position:relative;
}
.statusbar .right{display:flex;gap:5px;align-items:center;font-size:11px}
.screen{
  flex:1;overflow-y:auto;overflow-x:hidden;position:relative;
  -webkit-overflow-scrolling:touch;
}
.screen::-webkit-scrollbar{width:0}
.page{display:none;padding:0 16px 24px;animation:fade .28s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 通用 ============ */
.h1{font-size:25px;font-weight:800;letter-spacing:-.4px;margin:6px 0 2px}
.sub{font-size:12px;color:var(--t3);line-height:1.5}
/* 正文里的 <b> 只作强调、不作警报：权重降一档，避免满屏加粗互相抢 */
b,strong{font-weight:620}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.sec-title b{font-size:15px;font-weight:750;letter-spacing:-.2px}
.sec-title .more{font-size:11px;color:var(--t3);font-weight:600}
.card{background:var(--card);border-radius:var(--r-l);padding:15px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap;
  background:var(--fill);color:var(--t2);
}
/* 分类标签：中性底 + 彩色字，减少同屏色块面积 */
.tag-paper{color:var(--paper)}
.tag-note{color:#C2740A}
.tag-light{color:var(--light)}
.tag-video{color:#6D28D9}
.tag-grey{color:var(--t2)}
/* 状态标签：保留彩色底，因为它们需要被一眼看到 */
.tag-ok{background:var(--ok-soft);color:#0E8A57}
.tag-warn{background:#FFF3E0;color:#C2740A}
.tag-brand{background:var(--brand-soft);color:var(--brand)}
.btn{
  border:none;border-radius:12px;font-size:14px;font-weight:700;
  padding:13px 18px;background:var(--brand);color:#fff;width:100%;
  cursor:pointer;transition:transform .12s,opacity .12s;font-family:inherit;
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.ghost{background:#F1F3F6;color:var(--t1)}
.btn.line{background:#fff;border:1.4px solid var(--line);color:var(--t1)}
.btn.sm{padding:9px 14px;font-size:12px;border-radius:12px;width:auto}
.btn.blue{background:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{height:0}
.chip{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;
  background:#fff;color:var(--t2);border:1px solid var(--line);cursor:pointer;white-space:nowrap
}
.chip.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.bar{height:6px;border-radius:99px;background:#F1F3F6;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .6s cubic-bezier(.3,1,.4,1)}
.divider{height:1px;background:var(--line);margin:12px 0}
.mono{font-variant-numeric:tabular-nums}

/* 纯度堆叠条 */
.purity{display:flex;height:5px;border-radius:99px;overflow:hidden;background:#F1F3F6}
.purity i{display:block;height:100%}

/* ============ 底部 Tab ============ */
.tabbar{
  flex:0 0 78px;height:78px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);border-top:1px solid var(--line);
  display:flex;align-items:flex-start;padding-top:9px;z-index:100;
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;color:#B6BCC7;font-size:11px;font-weight:650;transition:color .2s
}
.tabbar .tab svg{width:23px;height:23px}
.tabbar .tab.on{color:var(--brand)}

/* ============ 子页面（全屏推入） ============ */
.subpage{
  position:absolute;inset:0;background:var(--bg);z-index:400;
  display:none;flex-direction:column;
}
.subpage.active{display:flex;animation:slideIn .3s cubic-bezier(.25,.9,.3,1)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.navbar{
  flex:0 0 auto;padding:52px 16px 10px;display:flex;align-items:center;gap:10px;
  background:#fff;border-bottom:1px solid var(--line);
}
.navbar .back{font-size:22px;line-height:1;cursor:pointer;color:var(--t1);padding:2px 6px 2px 0}
.navbar b{font-size:16.5px;font-weight:750;flex:1;letter-spacing:-.2px}
.subbody{flex:1;overflow-y:auto;padding:14px 16px 28px}
.subbody::-webkit-scrollbar{width:0}

/* ============ 底部抽屉 ============ */
.mask{position:absolute;inset:0;background:rgba(10,12,16,.45);z-index:500;display:none;animation:fade .2s}
.mask.active{display:block}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:24px 24px 0 0;z-index:600;padding:8px 18px 26px;
  display:none;max-height:86%;overflow-y:auto;box-shadow:var(--shadow-up)
}
.sheet.active{display:block;animation:up .32s cubic-bezier(.22,1,.3,1)}
.sheet::-webkit-scrollbar{width:0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;background:#E3E6EB;border-radius:8px;margin:4px auto 14px}
.sheet h3{font-size:17px;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.sheet .desc{font-size:12px;color:var(--t3);margin:0 0 14px;line-height:1.55}

/* toast */
.toast{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(20,22,26,.92);color:#fff;padding:13px 20px;border-radius:16px;
  font-size:13px;font-weight:600;z-index:900;opacity:0;pointer-events:none;
  transition:all .25s;max-width:78%;text-align:center;line-height:1.5
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 列表项 */
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li .ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.li .tt{font-size:14px;font-weight:650}
.li .dd{font-size:11px;color:var(--t3);margin-top:2px}
.li .arrow{color:#CFD4DC;font-size:17px}

/* switch */
.sw{width:44px;height:26px;border-radius:99px;background:#E1E5EA;position:relative;cursor:pointer;transition:background .22s;flex:0 0 auto}
.sw.on{background:var(--ok)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .22s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:21px}

/* segmented */
.seg{display:flex;background:#F1F3F6;border-radius:12px;padding:3px;gap:2px}
.seg>div{flex:1;text-align:center;font-size:12px;font-weight:650;padding:8px 4px;border-radius:8px;color:var(--t2);cursor:pointer;transition:.18s}
.seg>div.on{background:#fff;color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.hint{font-size:11px;color:var(--t3);line-height:1.7;background:var(--fill-2);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
/* 重点卡：仅用一条左边框标记，不再用整块粉底 —— 每屏最多出现一次 */
.innov{background:var(--card);border-left:3px solid var(--brand)}
.innov-badge{font-size:10px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:3px 7px;border-radius:6px;letter-spacing:.2px}

/* ============ 侧边悬浮 AI 小助手 ============ */
/* z-index 450：高于子页面(400) 所以能一直停在侧边，低于遮罩(500)/抽屉(600) 所以不会挡住抽屉 */
.fab-ai{
  position:absolute;right:13px;bottom:104px;z-index:450;
  width:50px;height:50px;border-radius:50%;
  background:linear-gradient(140deg,#1F2430,#2C3342);
  box-shadow:0 5px 18px rgba(20,22,26,.34);
  display:none;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;transition:transform .14s;
}
.fab-ai.show{display:flex;animation:fabIn .3s cubic-bezier(.2,1.35,.4,1)}
.fab-ai:active{transform:scale(.9)}
.fab-ai .ring{position:absolute;inset:-4px;border-radius:50%;border:1.7px solid;opacity:.55}
.fab-ai .dot{
  position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;font-size:11px;
}
@keyframes fabIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
/* 首次出现时的一次性提示气泡 */
.fab-tip{
  position:absolute;right:70px;bottom:116px;z-index:450;
  background:rgba(20,22,26,.92);color:#fff;border-radius:12px;
  padding:8px 11px;font-size:11px;font-weight:600;line-height:1.5;
  max-width:172px;opacity:0;pointer-events:none;transition:opacity .3s;
  box-shadow:0 4px 14px rgba(20,22,26,.28);
}
.fab-tip.show{opacity:1}
/* 头像浮在右下角，给子页面底部留出空间，避免压住末尾按钮 */
.phone.has-fab .subpage.active .subbody{padding-bottom:88px}
@media (max-width:430px){
  body{padding:0;background:var(--bg)}
  .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
  .notch{display:none}
  .statusbar{display:none}
  .navbar{padding-top:16px}
}
</style>

    '<div class="navbar"><div class="back" onclick="closeSub()">‹</div><b>'+title+'</b>'+(opts.right||'')+'</div>'+
    '<div class="subbody">'+html+'</div>';
  /* AI 小助手上下文：未显式指定则继承上一层，这样从领域页点进原文/文献/图谱时头像不会消失 */
  el._aiFid = (opts.aiFid !== undefined) ? opts.aiFid : aiFid();
  el._isChat = !!opts.isChat;
  /* 只保留最顶层为 active，否则 .subpage.active 会命中下层页面，导致滚动作用在错误容器上 */
  if(stack.length) stack[stack.length-1].classList.remove('active');
  $('#subpages').appendChild(el);
  stack.push(el);
  $('#screen').scrollTop = 0;
  renderFab();
}
function closeSub(){
  const el = stack.pop(); if(el) el.remove();
  if(stack.length){
    const top = stack[stack.length-1];
    top.classList.add('active');
    if(top.style) top.style.animation = 'none';   /* 返回时不重播入场动画 */
  }
  renderFab();
}
/* 当前子页面 / 其滚动容器 / 其内部元素 —— 全部限定在顶层页面内查找 */
function curSub(){ return stack.length ? stack[stack.length-1] : null; }
function curBody(){ const s = curSub(); return s ? s.querySelector('.subbody') : null; }
function subQ(sel){ const s = curSub(); return s ? s.querySelector(sel) : null; }
function switchTab(name){
  $$('.tabbar .tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-'+name).classList.add('active');
  $('#screen').scrollTop = 0;
  TAB_AI_FID = null;                /* 主 Tab 页没有单一领域上下文 */
  while(stack.length) closeSub();
  renderFab();
}

   四个主 Tab 页同时涉及多个领域，不显示头像（首页每个领域卡上各自有「问 AI」入口）。 */
let TAB_AI_FID = null;
let FAB_TIP_SHOWN = false;
let fabTipTimer;
function aiFid(){
  const top = curSub();
  return top ? top._aiFid : TAB_AI_FID;
}
function renderFab(){
  const el = $('#fabAI'), tip = $('#fabTip'), phone = $('.phone');
  if(!el) return;
  const top = curSub();
  const fid = (top && top._isChat) ? null : aiFid();   /* 已在对话页则不再显示入口 */
  const f = fid ? F(fid) : null;
  if(!f){
    el.classList.remove('show'); el.innerHTML = '';
    if(tip) tip.classList.remove('show');
    if(phone) phone.classList.remove('has-fab');
    return;
  }
  el.innerHTML = '<span class="ring" style="border-color:'+f.color+'"></span>🤖'+
                 '<span class="dot">'+f.emoji+'</span>';
  el.setAttribute('aria-label', f.name+' · AI 小助手，点击提问');
  el.setAttribute('title', f.name+' · AI 小助手');
  el.classList.add('show');
  if(phone) phone.classList.add('has-fab');
  /* 首次出现给一次提示，之后不再打扰 */
  if(!FAB_TIP_SHOWN && tip){
    FAB_TIP_SHOWN = true;
    tip.innerHTML = '有看不懂的就问我<br><span style="opacity:.7;font-weight:500">只答这个领域资料里有依据的</span>';
    tip.classList.add('show');
    clearTimeout(fabTipTimer);
    fabTipTimer = setTimeout(()=>tip.classList.remove('show'), 3600);
  }
}
function openAssistantFromFab(){
  const fid = aiFid();

  if(fid) openAssistant(fid);
}
/* 用户输入要转义后再进 innerHTML，避免把输入当成 HTML 渲染 */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function purityBar(p){

}

function ringSVG(pct, size, stroke, color){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#F1F3F6" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
  '</svg>';
}

function speakAnswer(){
  const txt = '嗯…普通助手就是你问一句它答一句，你不问它就不动。智能体 AI 更像一个小组，你给个目标，它们自己分工、自己往下推，还记得之前干到哪了。';
  const box = $('#ansBox'); box.style.color='var(--t1)'; box.innerHTML='';
  $('#micBtn').innerHTML = '🎙 正在听…';
  let i=0;
  const tm = setInterval(()=>{
    box.innerHTML = txt.slice(0,++i)+'<span style="opacity:.4">|</span>';

/* ================== 知识冲突检测 —— 创新点 ================== */
function openConflict(){
  const c = DB.conflict;
  const side = (o,tagCls,recommend)=>
    '<div style="border:1.5px solid '+(recommend?'var(--paper)':'var(--line)')+';border-radius:16px;padding:13px;margin-bottom:10px;'+(recommend?'background:var(--paper-soft)':'background:#fff')+'">'+
      '<div class="between" style="margin-bottom:7px"><span class="tag '+tagCls+'">'+o.purity+'</span>'+
      '<span style="font-size:11px;color:var(--t3);font-weight:650">可信权重 '+o.weight+'</span></div>'+
      '<div style="font-size:13px;font-weight:650;line-height:1.6">'+o.txt+'</div>'+
      '<div style="font-size:11px;color:var(--t3);margin-top:7px">来源：'+o.src+'</div>'+
      (recommend?'<div style="font-size:11px;color:var(--paper);font-weight:700;margin-top:8px">✓ AI 建议采信此条</div>':'')+
    '</div>';
  let h = '';
  h += '<div class="card innov"><div class="row" style="margin-bottom:8px"><span class="innov-badge">创新</span>'+
      '<b style="font-size:13px">笔记 × 文献 冲突检测</b></div>'+
      '<div style="font-size:12px;color:var(--t2);line-height:1.65">学习里最贵的错误不是"没学"，而是<b style="color:var(--t1)">把记错的东西反复背牢</b>。'+
      '你自己写下的结论一旦与权威文献矛盾，系统会在入库时就发现，冻结该知识点并请你裁决，而不是让它一路进入复习计划。</div></div>';
  h += '<div class="card">'+
      '<div style="font-size:11px;color:var(--t3);font-weight:650;margin-bottom:4px">冲突主题</div>'+
      '<div style="font-size:15px;font-weight:750;line-height:1.45;margin-bottom:14px">'+c.topic+'</div>'+
      side(c.a,'tag-note',false)+
      '<div style="text-align:center;font-size:11px;color:var(--t3);font-weight:700;margin:2px 0 10px">— 与之矛盾 —</div>'+
      side(c.b,'tag-paper',true)+
    '</div>';
  h += '<div class="card"><b style="font-size:14px">如何处理</b>'+
      '<div style="margin-top:12px;display:flex;flex-direction:column;gap:9px">'+
      '<button class="btn blue" onclick="resolveConflict(\'b\')">采信权威文献，把笔记标为「已纠偏」</button>'+
      '<button class="btn line" onclick="resolveConflict(\'keep\')">两条都保留，学习时并列展示</button>'+
      '<button class="btn ghost" onclick="resolveConflict(\'read\')">我要先读原文 3.5 节再决定</button></div>'+
      '<div class="hint" style="margin-top:13px">处理结果会写回「笔记 → 手写本 B 第 3 页」的标签上。若你选择采信文献，该页会标「已纠偏」，并在下次复习时优先推送正确版本，防止旧印象反弹。</div></div>';
  openSub('知识冲突', h);
}
function resolveConflict(k){
  closeSub();
  const msg = {
    b:'已采信文献结论<br><span style="font-size:11px;opacity:.8">手写本 B 第 3 页已标「已纠偏」，下次复习优先推正确版本</span>',
    keep:'已并列保留<br><span style="font-size:11px;opacity:.8">学习时将同时展示两种说法及各自权重</span>',
    read:'已加入今日任务：精读 3.5 节'
  }[k];
  toast(msg);
}

    '</div>'+

  );

/* ================== 上传 · AI 结构化萃取流水线 ================== */
function openUpload(){
  openSheet(
    '<h3>上传资料</h3><p class="desc">五种入口，统一进入结构化萃取。AI 会自动判定进入哪个学习板块。</p>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
      [['📄','PDF 文献','自动识别标题/作者/被引','tag-paper','文献板块'],
       ['🎬','视频课程','字幕转写 + 按讲解切章 + 时间码','tag-video','视频板块'],
       ['✏️','手写笔记','OCR + 手写体 + 草图理解','tag-note','笔记板块'],
       ['🖼','截图图片','版面切分 + 文字提取','tag-note','笔记板块'],
       ['⌨️','纯文字','直接粘贴或语音转写','tag-note','笔记板块']].map(o=>
        '<div onclick="runPipeline(\''+o[1]+'\',\''+o[4]+'\')" style="background:#FAFBFC;border:1.2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer">'+
        '<div style="font-size:22px">'+o[0]+'</div>'+
        '<div style="font-size:13px;font-weight:700;margin-top:7px">'+o[1]+'</div>'+
        '<div style="font-size:11px;color:var(--t3);margin-top:3px;line-height:1.45">'+o[2]+'</div>'+
        '<div style="margin-top:8px"><span class="tag '+o[3]+'">进入 '+o[4]+'</span></div></div>').join('')+
    '</div>'+
    '<div class="hint" style="margin-top:14px">🎬 视频支持 mp4 / mov / 在线课程链接，单个最长 4 小时。<br>🔒 <b>隐私默认保护：</b>手写笔记、截图与本地视频默认<b>仅本机解析</b>，不上传原文件。</div>'
  );
}
let PIPE_CUR = [], PIPE_VID = false, PIPE_BLK = '文献板块';
const PIPE = [
  '解析文件结构 · 识别版面',
  '提取正文与图表说明',
  '判定所属学习板块',
  '切分知识点 · 去重',
  '通俗化转译（中文口语层）',
  '与已有知识库比对 · 冲突检测',
  '写入今日知识图谱 · 排复习节点'
];
const PIPE_VIDEO = [
  '解码视频 · 提取音轨',
  '语音转写字幕（带时间码）',
  '按讲解节奏自动切章',
  '识别板书 / PPT 关键帧',
  '切分知识点 · 绑定时间码',
  '与已有知识库比对 · 冲突检测',
  '写入今日知识图谱 · 排复习节点'
];
function runPipeline(kind, block){
  closeSheet();
  const isVideo = kind.indexOf('视频')>-1;
  const steps = isVideo ? PIPE_VIDEO : PIPE;
  const file = isVideo ? '多智能体系统设计_公开课.mp4 · 96 分钟 · 1.2 GB'
    : kind.indexOf('PDF')>-1 ? 'agentic_ai_in_product_management.pdf · 3.1 MB' : 'IMG_2026_0923.heic · 3 张 · 6.1 MB';
  const bm = block==='文献板块'?BLOCK_META.paper : block==='视频板块'?BLOCK_META.video : BLOCK_META.note;
  let h = '<div class="card"><div class="row" style="margin-bottom:4px">'+
    '<div style="width:40px;height:40px;border-radius:12px;background:'+(isVideo?'#EDE9FE':'var(--paper-soft)')+';display:flex;align-items:center;justify-content:center;font-size:19px">'+(isVideo?'🎬':'📄')+'</div>'+
    '<div class="grow"><div style="font-size:14px;font-weight:750">'+kind+'</div>'+
    '<div style="font-size:11px;color:var(--t3);margin-top:2px">'+file+'</div></div>'+
    '<span class="tag '+bm.cls+'">'+block+'</span></div></div>';
  h += '<div class="card"><b style="font-size:14px">AI 结构化萃取</b><div id="pipe" style="margin-top:14px"></div></div>';
  h += '<div id="pipeResult"></div>';
  openSub('AI 处理中', h);
  PIPE_CUR = steps; PIPE_VID = isVideo; PIPE_BLK = block;
  let i = 0;
  const box = $('#pipe');
  const draw = ()=>{
    box.innerHTML = PIPE_CUR.map((s,idx)=>{
      const st = idx<i ? 'done' : idx===i ? 'run' : 'wait';
      const ico = st==='done'?'<span style="color:var(--ok)">✓</span>' : st==='run'?'<span style="color:var(--brand)">◎</span>' : '<span style="color:#DDE1E7">○</span>';
      return '<div style="display:flex;gap:9px;align-items:center;padding:7px 0;font-size:12px;'+
        (st==='wait'?'color:var(--t3)':'color:var(--t1);font-weight:600')+'">'+ico+'<span>'+s+'</span>'+
        (st==='run'?'<span style="font-size:11px;color:var(--brand);margin-left:auto">处理中…</span>':'')+'</div>';
    }).join('');
  };
  draw();
  const tm = setInterval(()=>{
    i++; draw();
    if(i>=PIPE_CUR.length){ clearInterval(tm); setTimeout(pipeResult, 400); }
  }, 620);
}
function pipeResult(){
  const vid = PIPE_VID;
  const stats = vid ? [['23','知识点'],['6','章节'],['96','分钟字幕']] : [['17','知识点'],['3','图表'],['1','冲突']];
  $('#pipeResult').innerHTML =
    '<div class="card" style="animation:fade .4s"><div class="between" style="margin-bottom:12px">'+
      '<b style="font-size:14px">萃取完成</b><span class="tag tag-ok">已入库</span></div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;text-align:center">'+
        stats.map(o=>
        '<div style="background:#FAFBFC;border-radius:12px;padding:11px 4px">'+
        '<div style="font-size:19px;font-weight:800">'+o[0]+'</div>'+
        '<div style="font-size:11px;color:var(--t3);margin-top:2px">'+o[1]+'</div></div>').join('')+
      '</div>'+
      (vid?'<div style="margin-top:13px"><div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px">自动切出的章节（含时间码）</div>'+
        [['00:00','为什么需要多个智能体'],['12:40','角色分工与任务分解'],['31:05','持久记忆怎么落地'],['52:18','编排层与冲突仲裁'],['70:02','护栏、审计与人在环'],['84:30','整体回顾']].map(c=>
          '<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line)">'+
          '<div class="row" style="gap:8px"><span class="tag tag-video" style="font-family:Georgia,serif">'+c[0]+'</span>'+
          '<span style="font-size:12px;font-weight:650">'+c[1]+'</span></div>'+
          '<span style="color:#CFD4DC;font-size:15px">›</span></div>').join('')+'</div>':'')+
      '<div class="divider"></div>'+
      '<div style="font-size:12px;line-height:1.9;color:var(--t2)">'+
      '<div>📂 已归入 <b style="color:var(--t1)">AI 产品与大模型</b> 的 <b style="color:var(--t1)">'+PIPE_BLK+'</b>（AI 自动判定，可改）</div>'+
      (vid?'<div>🔒 视频板块串行：排在《多智能体系统设计 · 公开课》之后，学完前一门才开启</div>'
          :'<div>🔒 文献板块串行：排在当前那一篇之后，学完才开启</div>')+
      '<div>⚖️ 压力平衡：已拆为 <b style="color:var(--t1)">'+(vid?'8':'6')+' 天</b> 计划，每天不超 25 分钟</div>'+
      '<div>🔁 复习节点已排：第 1 / 3 / 7 / 15 天</div>'+
      (vid?'<div>⏱ 每个知识点都绑定了时间码，复习时可一键跳回那一秒</div>'
          :'<div>⚠️ 与你「手写本 B 第 3 页」的一条结论冲突，已冻结待你裁决</div>')+
      '<div>🕸 已写入 <b style="color:var(--t1)">今日</b> 知识图谱（9/23）</div>'+
      '</div>'+
      '<div style="display:flex;gap:9px;margin-top:15px">'+
      '<button class="btn" onclick="closeSub();renderHome();renderNotes();toast(\'已加入学习计划队列\')">加入学习队列</button>'+
      '<button class="btn line" style="flex:0 0 96px" onclick="'+(vid?'openSrcVideo(\'ai-v1\')':'openConflict()')+'">'+(vid?'看视频':'看冲突')+'</button></div>'+
    '</div>';
}

/* 某板块的资料清单（含串行锁） */
function blockRow(f, k){
  const bm = BLOCK_META[k], items = blockItems(f,k), active = f.plan.activeBlock===k;
  const idx = f.plan.order.indexOf(k);
  const prevDone = f.plan.order.slice(0,idx).every(x=>blockDone(f,x));
  let h = '<div style="margin-top:14px">'+
    '<div class="between" style="margin-bottom:8px">'+
      '<div class="row" style="gap:6px"><span class="tag '+bm.cls+'">'+bm.ico+' '+bm.label+'板块</span>'+
      (active?'<span class="tag tag-brand">进行中</span>':blockDone(f,k)?'<span class="tag tag-ok">已完成</span>':
        prevDone?'<span class="tag tag-grey">待开始</span>':'<span class="tag tag-grey">🔒 未解锁</span>')+'</div>'+
      '<span style="font-size:11px;color:var(--t3)">'+(bm.seq?'逐个学完':'可穿插')+'</span></div>';
  if(!items.length){
    h += '<div style="font-size:11px;color:var(--t3);background:#FAFBFC;border-radius:8px;padding:10px 11px">该板块暂无资料，可上传或从文献库添加</div></div>';
    return h;
  }
  let firstUndone = true;
  items.forEach(it=>{
    const pctv = Math.round(it.done/it.total*100);
    const isDone = it.status==='done';
    const isCur = !isDone && firstUndone;
    if(!isDone && firstUndone) firstUndone = false;
    const locked = bm.seq && !isDone && !isCur;
    h += '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:12px;margin-bottom:7px;'+
      (isCur&&active?'background:'+f.color+'0D;box-shadow:inset 0 0 0 1.3px '+f.color+'44':'background:#FAFBFC')+
      (locked?';opacity:.62':'')+'" onclick="openMat(\''+it.id+'\')">'+
      '<div style="flex:0 0 auto;width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;'+
        (isDone?'background:var(--ok-soft);color:var(--ok)':isCur?'background:'+f.color+';color:#fff':'background:#EDEFF2;color:#9AA1AE')+'">'+
        (isDone?'✓':locked?'🔒':'▶')+'</div>'+
      '<div class="grow"><div style="font-size:12px;font-weight:700;line-height:1.4">'+it.title+'</div>'+
      '<div style="font-size:10px;color:var(--t3);margin-top:2px">'+it.sub+'</div>'+
      '<div class="bar" style="height:4px;margin-top:6px"><i style="width:'+pctv+'%;background:'+(isDone?'var(--ok)':f.color)+'"></i></div>'+
      '<div class="between" style="font-size:10px;color:var(--t3);margin-top:4px">'+
      '<span>'+it.done+' / '+it.total+' '+bm.unit+'</span>'+
      '<span>'+(isDone?'已学完':locked?'需先学完上一'+(k==='paper'?'篇':'门'):isCur?'正在学 · 每次 '+it.step+' '+bm.unit:'排队中')+'</span></div></div></div>';
  });
  h += '</div>';
  return h;
}

  const f = F(CP.fid);
  /* 只冻结「这个领域」原来的推进对象，其他领域各自的线不受影响 */
  BLOCK_ORDER.forEach(k=>blockItems(f,k).forEach(it=>{
    if(it.status==='learning') it.status = it.done>0 ? 'paused' : 'queued';

  DB.mainFolder = CP.fid;                       /* 今日重点领域，仅影响图谱默认视角 */
  f.plan.activeBlock = CP.blk;

  if(sel && sel.status!=='done') sel.status = 'learning';

}

function tuneGoal(id,key,d){
  const f = F(id);
  const min = {pages:1,points:1,minutes:5}[key], step = key==='minutes'?5:1;

  const f = F(id), tot = matTot(f);

  $('#goalCalc').innerHTML = '⚖️ 按当前设置：'+pts+' 个知识点 ≈ <b>'+days+' 天</b>学完，每天约 '+f.goal.minutes+' 分钟。'+warn;

          ['大白话理解整理','我自己写的文字',2],
          ['截图剪藏 · 来自小红书','图 2 张 · 已打来源标',2],
          ['截图剪藏 · 来自知乎高赞','图 1 张 · 已打来源标',1]],
    video:[[(ND.name||'该领域')+'入门 8 讲','在线课程 · 共 96 分钟',96],
           ['实操演示课','本地视频 · 共 48 分钟',48]]

function ndCreate(){
  const idx = DB.folders.length % ND_EMOJI.length;
  const pi = ND_PRESETS.indexOf(ND.name);
  const fid = 'nd'+Date.now().toString().slice(-5);
  const mk = (arr, step) => arr.map((x,i)=>({
    id:fid+'-'+i, title:x.title, sub:x.sub, total:x.total, done:0, step:step,
    status:i===0?'learning':'queued'
  }));
  const firstBlock = BLOCK_ORDER.find(k=>ND.items[k].length) || 'paper';
  const f = {
    id:fid, name:ND.name.trim(), emoji:ND_EMOJI[pi>=0?pi:idx], color:ND_COLORS[pi>=0?pi:idx],
    push:'20:00', goal:{pages:6, points:2, minutes:20},
    progress:0, streak:0, debt:0,
    load: (ND.items.paper.length? 'balanced':'too-few'),
    loadMsg: ND.items.paper.length
      ? '新建领域已按「每天 2 个知识点」拆分，首日从第 1 项开始'
      : '暂无权威文献，AI 已准备补推入门读物帮你立骨架',
    mastered:0, weak:0, gap:0,
    plan:{ order:['paper','note','video'], activeBlock:firstBlock },
    mats:{ paper:mk(ND.items.paper,5), note:mk(ND.items.note,2), video:mk(ND.items.video,15) }
  };
  /* 只让第一项处于 learning，其余排队 */
  BLOCK_ORDER.forEach(k=>f.mats[k].forEach((it,i)=>{ it.status = (k===firstBlock && i===0) ? 'learning' : 'queued'; }));
  DB.folders.push(f);
  closeSub();
  renderNotes(); renderHome(); renderLib();
  toast('已创建「'+f.name+'」<br><span style="font-size:11px;opacity:.85">'+matTot(f)+' 项内容已排入队列，明天 '+f.push+' 开始推送</span>');
}

let libFilter = {level:'全部', only:'', q:'', folder:''};

/* 推荐可以指向「尚未建立」的领域（来自为你拓展），所以统一走这个函数取展示信息 */
function recFolderMeta(fid){
  const f = F(fid);
  if(f) return {id:fid, name:f.name, emoji:f.emoji, color:f.color, kind:'mine'};
  const e = EXPLORE.find(x=>x.id===fid);
  if(e) return {id:fid, name:e.name, emoji:e.emoji, color:e.color, kind:'explore'};
  const s = SUBJECTS[fid];
  if(s) return {id:fid, name:s.name, emoji:s.emoji, color:s.color, kind:'lib'};
  return {id:fid, name:'未分类', emoji:'🗂', color:'#9AA1AE', kind:'lib'};
}
/* 检索池：默认只看推荐；一旦搜索或筛选，就并入全库索引 */
function libPool(){
  const searching = !!(libFilter.q || libFilter.folder || libFilter.only);
  return searching ? DB.recs.concat(LIB_INDEX) : DB.recs;
}
function libIsSearching(){ return !!(libFilter.q || libFilter.folder || libFilter.only); }

/* 文献推荐覆盖的全部领域：已建立的 + 可拓展的，按推荐条数排序 */
function libAllFolders(){
  const pool = DB.recs.concat(LIB_INDEX);
  const seen = [], out = [];
  pool.forEach(r=>{ if(seen.indexOf(r.folder)<0){ seen.push(r.folder); out.push(recFolderMeta(r.folder)); } });
  out.forEach(m=>{ m.count = pool.filter(r=>r.folder===m.id).length; });
  return out;
}

function recCard(r, opts){
  opts = opts || {};
  const m = recFolderMeta(r.folder);
  /* 状态标签按重要性取一个就够：纠偏 > 补缺口 > 垫台阶 > 已在库 */
  const status = r.conflictFix ? ['tag-warn','⚠️ 纠偏用']
               : r.gap        ? ['tag-brand','🧩 补缺口']
               : r.balance    ? ['tag-grey','⚖️ 垫台阶']
               : r.inLib      ? ['tag-ok','✓ 已在库'] : null;
  return '<div class="card">'+
    '<div class="between" style="align-items:flex-start">'+
      '<div class="grow" style="padding-right:10px">'+
        '<div style="font-size:15px;font-weight:750;line-height:1.4">'+r.title+'</div>'+
        '<div style="font-size:11px;color:var(--t3);margin-top:4px">'+r.author+' · '+r.cite+'</div></div>'+
      '<div style="text-align:center;flex:0 0 auto">'+
        '<div style="font-size:17px;font-weight:800;color:var(--brand)">'+r.match+'</div>'+
        '<div style="font-size:10px;color:var(--t3)">匹配度</div></div>'+
    '</div>'+
    /* 一张卡只留一个状态标签：难度与领域并进一行细字，避免 4–6 个色块并排 */
    '<div style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:11px;color:var(--t3)">'+
      '<span>'+r.level+'</span><span style="opacity:.45">·</span>'+
      (opts.hideFolder?'':'<span>'+m.emoji+' '+m.name+
        (m.kind==='explore'?'（可拓展）':m.kind==='lib'?'（全库）':'')+'</span>')+
      (status?'<span class="tag '+status[0]+'" style="margin-left:2px">'+status[1]+'</span>':'')+
    '</div>'+
    /* 推荐位的文献带「为什么推给你」；全库检索结果没有推荐理由，就不硬造一个 */
    (r.why
      ? '<div style="margin-top:11px;font-size:11px;color:var(--t2);background:#FAFBFC;border-radius:8px;padding:9px 11px;line-height:1.6">'+
        '<b style="color:var(--t1)">为什么推给你：</b>'+r.why+'</div>'
      : '')+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      (m.kind==='explore'
        ? '<button class="btn sm" style="flex:1" onclick="openNewDomain(\''+r.folder+'\')">新建「'+m.name+'」并加入</button>'
        : m.kind==='lib'
          ? '<button class="btn sm" style="flex:1" onclick="openLibImport(\''+r.id+'\')">导入到我的领域</button>'
          : (r.inLib
              ? '<button class="btn sm ghost" style="flex:1" onclick="toast(\'该文献已在「'+m.name+'」的文献板块中\')">已加入 '+m.name+'</button>'
              : (opts.folderId
                  ? '<button class="btn sm" style="flex:1" onclick="doImport(\''+r.id+'\',\''+opts.folderId+'\')">加入本领域文献板块</button>'
                  : '<button class="btn sm" style="flex:1" onclick="importRec(\''+r.id+'\')">一键导入领域</button>')))+
      '<button class="btn sm line" style="flex:0 0 74px" onclick="toast(\'已生成 5 句话摘要\')">先试读</button></div>'+
  '</div>';
}

function libMatch(r, q){
  if(!q) return true;
  const m = recFolderMeta(r.folder);
  const hay = (r.title+' '+r.author+' '+r.why+' '+r.level+' '+r.cite+' '+m.name).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.indexOf(w)>-1);
}
function libList(){
  let list = libPool().slice();
  if(libFilter.q) list = list.filter(r=>libMatch(r, libFilter.q));
  if(libFilter.folder) list = list.filter(r=>r.folder===libFilter.folder);
  if(libFilter.level!=='全部') list = list.filter(r=>r.level===libFilter.level);
  if(libFilter.only==='gap') list = list.filter(r=>r.gap);
  if(libFilter.only==='balance') list = list.filter(r=>r.balance);
  if(libFilter.only==='new') list = list.filter(r=>recFolderMeta(r.folder).kind!=='mine');
  list.sort((a,b)=>b.match-a.match);
  return list;
}

function radar(){
  const dims = [['输入广度',.82],['结构化',.9],['复述输出',.86],['坚持度',.64],['长文耐受',.39],['复习执行',.71]];
  const cx=155,cy=125,R=88;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/dims.length;return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
  let s = '<svg viewBox="0 0 310 250" style="width:100%;height:auto">';
  [1,.75,.5,.25].forEach(k=>{
    const p = dims.map((d,i)=>pt(i,R*k).join(',')).join(' ');
    s += '<polygon points="'+p+'" fill="none" stroke="#EDEFF2" stroke-width="1"/>';
  });
  dims.forEach((d,i)=>{const e=pt(i,R); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#EDEFF2"/>';});
  const poly = dims.map((d,i)=>pt(i,R*d[1]).join(',')).join(' ');
  s += '<polygon points="'+poly+'" fill="rgba(255,46,77,.18)" stroke="#FF2E4D" stroke-width="2"/>';
  dims.forEach((d,i)=>{const p=pt(i,R*d[1]); s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#FF2E4D"/>';});
  dims.forEach((d,i)=>{
    const p=pt(i,R+22);
    const anchor = Math.abs(p[0]-cx)<6?'middle':(p[0]>cx?'start':'end');
    s += '<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="'+anchor+'" font-size="10.5" font-weight="650" fill="'+(d[1]<.5?'#FF8A00':'#5A616E')+'" font-family="-apple-system,PingFang SC">'+d[0]+'</text>';
  });
  s += '</svg>';
  return s;
}

function openNotebookPage(k){
  const nb = NOTEBOOKS[k], f = F(nb.folder), list = NB_ENTRIES[k] || [];
  let h = '';
  /* 封面 */
  h += '<div class="card" style="padding:0;overflow:hidden">'+
    '<div style="display:flex">'+
      '<div style="flex:0 0 62px;background:linear-gradient(160deg,'+nb.color+','+nb.color+'CC);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 0;color:#fff">'+
        '<div style="font-size:22px">'+nb.emoji+'</div>'+
        '<div style="font-size:10px;font-weight:700;margin-top:7px;opacity:.9;writing-mode:vertical-rl;letter-spacing:1px">我的笔记本</div></div>'+
      '<div class="grow" style="padding:15px 15px">'+
        '<div style="font-size:15px;font-weight:800;letter-spacing:-.2px">'+nb.name+'</div>'+
        '<div style="font-size:11px;color:var(--t3);margin-top:4px;line-height:1.5">'+nb.desc+'</div>'+
        '<div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap">'+
          '<span class="tag tag-grey">'+f.emoji+' '+f.name+'</span>'+
          '<span class="tag tag-note">'+nb.pages+' 页</span>'+
          (nb.conflict?'<span class="tag tag-warn">⚠️ '+nb.conflict+' 处冲突</span>':'<span class="tag tag-ok">✓ 无冲突</span>')+
        '</div></div></div>'+
    '<div class="between" style="padding:11px 15px;border-top:1px solid var(--line);background:#FAFBFC">'+
      '<span style="font-size:11px;color:var(--t3)">建于 '+nb.start+' · 最近更新 '+nb.last+'</span>'+
      '<span style="font-size:11px;color:var(--t2);font-weight:650">共 '+list.length+' 条 · 已萃取 '+nb.points+' 个知识点</span></div>'+
  '</div>';

  /* 说明 */
  h += '<div class="hint">📓 笔记本什么都能装：<b>手写页、我自己敲的文字、从小红书 / 微博 / 知乎 / 公众号 / 资讯站剪下来的截图</b>。'+
    '所有内容统一进入<b>笔记板块</b>，权重低于文献；凡是能被判真假的结论，都会和文献核对后再决定是否进入学习计划。</div>';

  /* 条目流 */
  list.forEach(e=>{
    const sb = SRC_BADGE[e.src];
    const warn = e.note && e.note.indexOf('⚠️')===0, pause = e.note && e.note.indexOf('⏸')===0;
    h += '<div class="card" style="padding:0;overflow:hidden;cursor:pointer" onclick="'+
      (e.conflict?'openConflict()':e.open==='note'?'openSrcNote(\'n1\')':'openNBEntry(\''+k+'\',\''+e.id+'\')')+'">'+
      /* 条目头 */
      '<div class="between" style="padding:12px 14px 10px">'+
        '<div class="row" style="gap:7px">'+
          '<span class="tag" style="background:'+sb.bg+';color:'+sb.c+'">'+sb.ico+' '+sb.n+'</span>'+
          '<span class="tag tag-note">'+(e.kind==='hand'?'✏️ 手写':e.kind==='text'?'⌨️ 文字':'🖼 截图')+'</span></div>'+
        '<span style="font-size:10px;color:var(--t3)">'+e.time+'</span></div>'+
      '<div style="padding:0 14px 12px">'+
        '<div style="font-size:14px;font-weight:750;line-height:1.4">'+e.title+'</div>'+
        /* 正文 / 截图 */
        (e.body?'<div style="font-size:12px;color:var(--t2);line-height:1.75;margin-top:7px">'+e.body+'</div>':'')+
        (e.cap?'<div style="font-size:12px;color:var(--t2);line-height:1.7;margin-top:7px;padding-left:9px;border-left:2px solid '+sb.c+'44">'+e.cap+'</div>':'')+
        (e.shot?'<div style="display:flex;gap:7px;margin-top:10px">'+
          e.shot.map(ss=>'<div style="flex:1;aspect-ratio:4/3;border-radius:8px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden">'+
            '<div style="position:absolute;top:5px;left:5px;font-size:10px;font-weight:700;color:'+sb.c+';background:'+sb.bg+';padding:1.5px 5px;border-radius:6px">'+sb.n+'截图</div>'+
            '<span style="font-size:15px;opacity:.5">🖼</span>'+
            '<span style="font-size:10px;color:var(--t3);font-weight:600;text-align:center;padding:0 6px;line-height:1.3">'+ss+'</span></div>').join('')+
          '</div>':'')+
        /* 核对结论 */
        (e.note?'<div style="margin-top:10px;font-size:11px;line-height:1.6;border-radius:8px;padding:8px 10px;'+
          (warn?'background:#FFF3E0;color:#8A5A00':pause?'background:#F1F3F6;color:var(--t2)':'background:var(--ok-soft);color:#0E8A57')+'">'+e.note+'</div>':'')+
        '<div class="between" style="margin-top:11px">'+
          '<span style="font-size:11px;color:var(--t3)">已萃取 '+e.pts+' 个知识点</span>'+
          '<span style="font-size:11px;color:var(--brand);font-weight:700">'+(e.conflict?'去裁决 ›':'查看详情 ›')+'</span></div>'+
      '</div></div>';
  });

  /* 添加内容 */
  h += '<div class="card" style="padding:14px 16px">'+
    '<b style="font-size:13px">往这本笔记里添加</b>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px">'+
    [['✏️','手写拍照'],['⌨️','写点文字'],['🖼','截图剪藏'],['🔗','粘贴链接']].map(o=>
      '<div onclick="toast(\''+o[1]+'：已进入添加流程\')" style="background:#FAFBFC;border:1.2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer">'+
      '<div style="font-size:17px">'+o[0]+'</div>'+
      '<div style="font-size:12px;font-weight:700;margin-top:5px">'+o[1]+'</div></div>').join('')+
    '</div></div>';
  openSub('笔记本', h);
}

function openNBEntry(k, eid){
  const e = (NB_ENTRIES[k]||[]).find(x=>x.id===eid); if(!e) return;
  const sb = SRC_BADGE[e.src];
  openSheet(
    '<div class="row" style="margin-bottom:7px">'+
    '<span class="tag" style="background:'+sb.bg+';color:'+sb.c+'">'+sb.ico+' 来自'+sb.n+'</span>'+
    '<span class="tag tag-note">'+(e.kind==='text'?'⌨️ 文字':e.kind==='hand'?'✏️ 手写':'🖼 截图')+'</span></div>'+
    '<h3>'+e.title+'</h3><p class="desc">'+e.time+' · 已萃取 '+e.pts+' 个知识点</p>'+
    (e.cap?'<div style="background:#FAFBFC;border-radius:12px;padding:12px;font-size:12px;line-height:1.75;color:var(--t1);margin-bottom:12px"><b style="color:var(--t3);font-size:10px">我当时的备注</b><br>'+e.cap+'</div>':'')+
    (e.body?'<div style="background:#FAFBFC;border-radius:12px;padding:12px;font-size:12px;line-height:1.8;color:var(--t1);margin-bottom:12px">'+e.body+'</div>':'')+

    '<div style="display:flex;gap:9px">'+
    '<button class="btn line" onclick="closeSheet();toast(\'已打开原始截图\')">看原始截图</button>'+
    '<button class="btn ghost" style="flex:0 0 96px" onclick="closeSheet();openBadCase()">标记有误</button></div>'
  );
}

      { id:'ag-p21', page:'P3', cite:'A1',
        en:'While 92% of companies plan to increase AI investment over the next three years, only about 1% consider themselves mature in AI deployment. Most organizations struggle to integrate AI meaningfully into core workflows. This gap between ambition and execution is especially pronounced in product management, where AI adoption intersects with strategic planning, user experience and cross-functional coordination.',
        cn:'尽管有 <b>92%</b> 的企业计划在未来三年增加 AI 投入，只有约 <b>1%</b> 认为自己在 AI 部署上已经「成熟」。多数组织难以把 AI 真正嵌入核心工作流。这种「野心与执行之间的落差」在产品管理领域尤其明显，因为 AI 的落地同时牵动战略规划、用户体验和跨职能协同。',
        keynote:'这两个数字（92% 与 1%）是你笔记里「大家都在投 AI，但没人真的用起来」那句判断的原文依据。' },
      { id:'ag-p22', page:'P4',
        en:'At the same time, failure rates remain high: over 80% of AI projects fail to deliver expected outcomes, with poor data quality, weak integration and misalignment between AI output and business goals as primary causes. The specific problem is that traditional product management frameworks are ill-equipped for systems that act with independence, adapt strategies, and evolve from environmental feedback.',
        cn:'同时失败率居高不下：<b>超过 80%</b> 的 AI 项目未能交付预期结果，主因是数据质量差、集成薄弱、以及 AI 产出与业务目标不对齐。真正的问题在于：<b>传统产品管理框架无法容纳这样一类系统</b>——它不只执行既定指令，还会自主行动、调整策略、并根据环境反馈持续演化。' }
    ]},
    { id:'ag-s3', no:'3', en:'Generative AI vs. AI Agent vs. Agentic AI', cn:'三者辨析：生成式 AI / AI 智能体 / 智能体 AI', page:'P8–P9', paras:[
      { id:'ag-p31', page:'P8', hit:'a1', cite:'A2',
        en:'Generative AI refers to systems, notably large language models and large image models, designed to produce novel text, images or code in response to prompts. They function primarily as reactive systems: they generate content when prompted, but do not independently pursue objectives or interact with external environments unless explicitly directed.',
        cn:'<b>生成式 AI（Generative AI）</b>指以大语言模型、大图像模型为代表的一类系统，用于按提示生成新的文本、图像或代码。它们本质上是<b>反应式（reactive）</b>系统：被提示时产出内容，但不会自主追求目标，也不会与外部环境交互——除非被明确指派。' },
      { id:'ag-p32', page:'P8', cite:'A2',
        en:'An AI agent builds on generative AI by adding tool use, function calling, sequential reasoning and a limited degree of autonomy. It can perform multi-step goal-directed tasks, retrieve real-time information and call external APIs. However, agents typically operate as single-entity systems within a bounded scope, and their autonomy is confined to one workflow or session.',
        cn:'<b>AI 智能体（AI agent）</b>在生成式 AI 之上叠加了工具调用、函数调用、序列推理和有限自主性。它能执行多步的目标导向任务、获取实时信息、调用外部 API。但智能体通常是<b>单体系统</b>，作用范围有边界，其自主性<b>仅限于单个工作流或单次会话</b>。' },
      { id:'ag-p33', page:'P9', cite:'A2',
        en:'Agentic AI, by contrast, is a paradigm shift toward systems composed of multiple specialized agents that collaborate, communicate, plan dynamically and allocate sub-tasks toward shared objectives. Such systems feature persistent memory, dynamic task decomposition, multi-agent orchestration and coordinated autonomy, and they exhibit emergent behavior in unstructured environments.',
        cn:'<b>智能体 AI（Agentic AI）</b>则是一次范式转移：系统由<b>多个各有专长的智能体</b>组成，它们相互协作、通信、动态规划，并为共同目标分配子任务。这类系统具备<b>持久记忆、动态任务分解、多智能体编排、协同自主</b>四项特征，并在非结构化环境中表现出<b>涌现行为</b>。',
        keynote:'这一段是三者边界的直接依据。注意作者随后提醒：三者不是互斥概念，而是 AI 能力演进的连续阶段。' },
      { id:'ag-p34', page:'P9',
        en:'The authors note that these three should not be read as rigidly separate categories. They represent successive stages in the evolution of AI capability, and the focus of the study is how this progression reshapes the practice and theory of product management.',
        cn:'作者特别提醒：这三者<b>不应被视为界限僵硬的独立概念</b>，而是 AI 能力演进的<b>连续阶段</b>。本研究关注的是这一演进过程如何重塑产品管理的实践与理论。' }
    ]},
    { id:'ag-s4', no:'4', en:'Theoretical Framework', cn:'理论基础：三个互补的视角', page:'P10–P14', paras:[
      { id:'ag-p41', page:'P11', hit:'a2', cite:'A3',
        en:'Systems thinking lets PMs see beyond isolated tasks and features to the broader implications of decisions. Unlike linear planning models, it emphasizes feedback loops and emergent outcomes that arise when autonomous agents interact with users, data, infrastructure and policy. It helps anticipate second-order effects, such as how AI-driven personalization may gradually affect user trust or regulatory risk.',
        cn:'<b>系统思维</b>让产品经理超越孤立的任务与功能，看到决策的更广影响。与线性规划模型不同，它强调<b>反馈回路</b>和<b>涌现结果</b>——当自主智能体与用户、数据、基础设施、政策环境相互作用时产生的结果。它帮助预判<b>二阶效应</b>：比如 AI 驱动的个性化如何在长期内悄悄影响用户信任或监管风险。',
        keynote:'关键动作：把成功指标从「功能采纳率」换成「系统长期健康度」。作者列出五条系统理论原则：整体思维、互联性、反馈回路、涌现、杠杆点。' },
      { id:'ag-p42', page:'P12', cite:'A3',
        en:'Co-evolutionary theory, rooted in evolutionary biology, describes reciprocal adaptive change when two entities evolve in response to each other over time. Applied here, PMs and AI systems are not static collaborators but interdependent actors whose roles and decision logic change through mutual feedback. As agents take on user segmentation or feature ideation, PMs must develop competencies in orchestration, supervision and ethical delegation.',
        cn:'<b>协同演化理论</b>源自进化生物学，描述两个实体因彼此的行动而长期<b>相互适应、共同改变</b>。应用到这里：产品经理与 AI 系统不是静态的协作方，而是<b>相互依赖的行动者</b>，双方的角色与决策逻辑都在相互反馈中改变。当智能体接手用户分群或功能构想时，产品经理必须补上编排、监督、<b>有伦理约束的授权</b>这些新能力。' },
      { id:'ag-p43', page:'P13',
        en:'Human-AI interaction theory clarifies how people engage with AI across levels of agency and task complexity. A central tenet is mutual intelligibility: humans must understand how and why agents decide, while agents must align with human intent and feedback. Interaction quality depends on explainability, trust calibration, shared mental models and control boundaries.',
        cn:'<b>人机交互理论（HAII）</b>阐明人在不同自主程度与任务复杂度下如何与 AI 协作。其核心主张是<b>相互可理解性</b>：人必须理解智能体为何、如何做决策，而智能体必须与人的意图和反馈对齐。交互质量取决于四件事：<b>可解释性、信任校准、共享心智模型、控制边界</b>。' },
      { id:'ag-p44', page:'P14', cite:'A3',
        en:'Three concepts recur: appropriate reliance, where human trust is calibrated to match actual AI capability; mental models, the cognitive representations people build to predict AI behavior; and adaptive interfaces, which evolve as collaboration needs change.',
        cn:'三个反复出现的概念：<b>适度依赖</b>（人的信任程度应与 AI 的真实能力相匹配）、<b>心智模型</b>（人为预测 AI 行为而建立的认知表征）、<b>自适应界面</b>（随协作需求变化而演化的界面）。',
        keynote:'「适度依赖」是这篇论文对做 AI 产品最直接可用的一条：过度信任和完全不信任同样有害，界面的职责是把真实能力边界暴露出来。' }
    ]},
    { id:'ag-s5', no:'5', en:'Mapping Agentic AI onto the Stage-Gate Lifecycle', cn:'能力映射：把智能体 AI 铺到 Stage-Gate 全流程', page:'P16–P25', paras:[
      { id:'ag-p50', page:'P14',
        en:'The Stage-Gate process divides new product development from discovery to launch into distinct stages separated by decision gates. The typical stages are Discovery, Scoping, Business Case Development, Development and Testing, and Launch. The study uses this framework to synthesize lifecycle, agentic capability and PM impact.',
        cn:'<b>Stage-Gate（阶段—关卡）流程</b>把新产品开发从发现到上线切成若干阶段，阶段之间由决策关卡分隔。典型阶段为：<b>发现 → 界定 → 商业论证 → 开发与测试 → 上线</b>。本研究用这个框架把「生命周期、智能体能力、对产品经理的影响」三者串起来。' },
      { id:'ag-p51', page:'P17', hit:'a3', cite:'A4',
        en:'Discovery. Agentic AI can continuously monitor social media, news, academic publications, patent databases and competitor announcements, identifying nascent trends and shifts in sentiment. This goes beyond aggregation: the agents interpret context and infer implications. PMs shift from manual collection to interpreting AI-generated insight and validating hypotheses with targeted human research.',
        cn:'<b>发现阶段。</b>智能体 AI 能持续监测社交媒体、新闻、学术出版、专利库和竞品公告，识别萌芽期趋势与情绪转向。这<b>超出了简单的数据聚合</b>：智能体会解读上下文并推断其含义。产品经理的工作重心从「手工收集」转向「解读 AI 产出的洞察，并用有针对性的人工研究去验证假设」。',
        keynote:'案例：Unilever 用智能体扫描社媒与电商，在素食/零残忍护肤成为主流趋势之前就捕捉到需求上升——产品经理的贡献是<b>定义什么算「萌芽需求」</b>，让 AI 的判断与品牌价值观对齐。' },
      { id:'ag-p52', page:'P19',
        en:'Scoping. Agents generate product concepts, features and user stories from identified needs, and can autonomously produce low-fidelity prototypes, wireframes or working mock-ups that respect an existing design system. PMs move from manual ideation toward curating AI-generated concepts and providing strategic guidance.',
        cn:'<b>界定阶段。</b>智能体可以从已识别的需求出发生成产品概念、功能和用户故事，并能自主产出低保真原型、线框图甚至可运行的仿真界面，同时遵守既有设计系统。产品经理从「亲手构想」转向「<b>筛选与策展</b> AI 生成的概念并给出战略指引」。' },
      { id:'ag-p53', page:'P21',
        en:'Business Case. Agents continuously pull market data and competitor metrics for dynamic sizing and revenue forecasts, build financial models, run sensitivity analyses and simulate best-case, worst-case and most-likely scenarios. The illustrative case is JP Morgan COiN, where contract review that once consumed roughly 360,000 hours of legal work was compressed to seconds.',
        cn:'<b>商业论证阶段。</b>智能体持续抓取市场数据与竞品指标，做动态市场规模估算与营收预测，自动搭建财务模型、做敏感性分析、模拟最好/最坏/最可能三种情景。书中案例是 <b>JP Morgan 的 COiN</b>：原本约 <b>36 万小时</b>的合同法务审阅被压缩到数秒。' },
      { id:'ag-p54', page:'P22',
        en:'Development and Testing. Agents generate code components, suggest architectural improvements, flag technical debt, auto-generate unit tests, and design and execute testing strategies across environments. They can also manage the CI/CD pipeline, detect build failures and resolve dependency conflicts.',
        cn:'<b>开发与测试阶段。</b>智能体生成代码组件、提出架构改进、标记技术债、自动生成单元测试，并跨环境设计与执行测试策略。它们还能管理 CI/CD 流水线、检测构建失败、解决依赖冲突。' },
      { id:'ag-p55', page:'P24',
        en:'Launch. Agents orchestrate deployment pipelines and phased rollouts, monitor performance and user experience in real time, autonomously diagnose root causes, trigger remediation such as scaling resources, and escalate to humans only when needed. Post-launch, they analyze engagement and conversion and implement small-scale optimizations, turning product management into a continuous optimization loop.',
        cn:'<b>上线阶段。</b>智能体编排部署流水线与分批放量，实时监控性能与用户体验，自主定位根因，触发补救动作（如扩容），<b>仅在必要时才上报给人</b>。上线后它们分析活跃与转化数据，自行实施小范围优化——产品管理由此变成一个<b>持续优化的闭环</b>。' }
    ]},
    { id:'ag-s6', no:'6', en:'The Co-Evolutionary Model: Four Relationships', cn:'协同演化模型：四条关系', page:'P26–P28', paras:[
      { id:'ag-p61', page:'P27', hit:'a4', cite:'A5',
        en:'First, PMs and agentic AI mutually shape each other. As agents become capable of autonomous execution, the PM role shifts toward higher-order functions: ethical supervision, prompt engineering, aligning multi-agent output with organizational goals, and critically interpreting AI-generated insight. At the same time the design and refinement of agents is shaped by human guidance and constraints, creating a continuous loop of mutual learning.',
        cn:'<b>第一条：双向塑造。</b>当智能体越来越能自主执行任务，产品经理的角色上移到更高阶的职能——伦理监督、提示工程、把多智能体的产出与组织目标对齐、以及<b>批判性地解读</b> AI 给出的洞察。同时，智能体的设计与调优又被人的指引和约束所塑造，形成<b>相互学习的连续回路</b>。',
        keynote:'一句话记住：PM 学会更好地用 AI，AI 学会更好地服务产品目标——两条学习曲线同时在跑。' },
      { id:'ag-p62', page:'P27',
        en:'Second, team structures become socio-technical ecosystems in which human and machine actors collaborate, sometimes seamlessly and sometimes with friction. PMs evolve from facilitators of human teams into orchestrators of hybrid workflows, where agents may act independently, cooperatively, or — if poorly governed — in ways that appear counterproductive to how objectives were encoded.',
        cn:'<b>第二条：团队变成社会—技术生态。</b>人与机器在其中协作，有时顺畅，有时摩擦。产品经理从「人类团队的组织者」演化为「<b>混合工作流的编排者</b>」——在这种工作流里，智能体可能独立行动、协同行动，或者在治理不当时，做出与「目标被编码的方式」相悖的、看起来反生产力的行为。' },
      { id:'ag-p63', page:'P28',
        en:'Third, governance, accountability and transparency become central. As agents take on feature prioritization, financial modeling or direct user interaction, PMs become accountable for the traceability, fairness and reliability of those decisions. This requires model validation, ongoing monitoring, human-in-the-loop supervision where appropriate, and precise documentation of how decisions were made.',
        cn:'<b>第三条：治理、可归责与透明成为核心。</b>当智能体承担功能优先级排序、财务建模甚至直接与用户交互时，产品经理要为这些决策的<b>可追溯性、公平性、可靠性</b>负责。这需要模型验证、持续监控、必要处的人在环监督，以及对「决策如何做出」的精确留档。' },
      { id:'ag-p64', page:'P28', conflict:true,
        en:'Fourth, decision-making logic itself shifts. Traditional product management assumes command-and-control: humans initiate, AI executes. Agentic AI can reverse and complicate this hierarchy, since agents may generate hypotheses, propose experiments or initiate user-facing changes on their own. PMs must therefore act less as gatekeepers of decisions and more as designers of behavioral guardrails. Their role becomes enabling responsible autonomy rather than exercising direct control.',
        cn:'<b>第四条：决策逻辑发生反转。</b>传统产品管理假定「命令—控制」结构：人发起，AI 执行。智能体 AI 会<b>反转并复杂化</b>这个层级，因为智能体可以自行提出假设、发起实验、甚至启动面向用户的变更。因此产品经理要<b>少做决策守门人，多做行为护栏的设计者</b>——其职责是「让自主是负责任的」，而不是行使直接控制。',
        keynote:'这一段是你笔记里「AI 只能听指令，人始终拍板」那条结论被判定为<b>与文献冲突并冻结</b>的直接依据。' }
    ]},
    { id:'ag-s7', no:'7', en:'Implications and Limitations', cn:'实践含义与局限', page:'P31–P33', paras:[
      { id:'ag-p71', page:'P31',
        en:'For practitioners the model highlights upskilling, organizational restructuring and ethical alignment. PMs need new competencies in AI supervision, model governance, prompt engineering, agent orchestration, and above all a systems-thinking mindset.',
        cn:'对从业者而言，这个模型强调三件事：<b>技能升级、组织重构、伦理对齐</b>。产品经理需要补上 AI 监督、模型治理、提示工程、智能体编排等能力，而其中最重要的是<b>系统思维</b>。' },
      { id:'ag-p72', page:'P33',
        en:'Limitations must be acknowledged: the framework is built on conceptual synthesis and has no empirical validation, and its focus on technology-intensive software organizations limits generalizability. The authors also raise a longer-term scenario in which increasingly capable systems manage the full spectrum of product functions, potentially rendering the human role marginal.',
        cn:'必须承认局限：该框架<b>建立在概念综合之上，尚无实证验证</b>，且聚焦技术密集型软件组织，普适性受限。作者还提出一个更长期的情景：当系统能力持续增强到能管理产品职能的全谱系时，<b>人类产品经理的角色可能被边缘化</b>。',
        keynote:'读综述类文献一定要找到这一段。「无实证验证」意味着：它提供的是思考框架，不是可以直接引用的结论。' }
    ]}
  ]
};

const PAPER_AIREVIEW = {
  title:'AI-to-AI Code Reviews of GitHub Pull Requests',
  titleCN:'AI 评审 AI：GitHub 拉取请求上的闭环代码评审',
  authors:'Niruthiha Selvanayagam（ÉTS Montréal）, Taher A. Ghaleb（Trent University）',
  venue:'ESEM 2026 · 第 20 届经验软件工程与度量国际研讨会 · CC BY 4.0',
  pages:15, cite:'248,641 个 PR · 含复现包',
  sections:[
    { id:'ar-abs', no:'', en:'Abstract', cn:'摘要', page:'P1', paras:[
      { id:'ar-abs1', page:'P1',
        en:'AI coding agents now operate on both sides of the pull request process: authoring agents that create or modify PRs, and reviewers that evaluate them. This creates a closed loop in which one AI agent reviews the contribution of another. The authors build a dataset by linking AI-authored PRs with AI-attributed review events from CodAGE, a public dataset of coding agent-generated GitHub events.',
        cn:'AI 编码智能体如今出现在拉取请求（PR）流程的<b>两侧</b>：一侧是创建或修改 PR 的<b>撰写型智能体</b>，另一侧是评审它们的<b>评审型智能体</b>。这形成一个闭环——一个 AI 智能体评审另一个 AI 智能体的贡献。作者基于 CodAGE（一个公开的「编码智能体产生的 GitHub 事件」数据集），把 AI 撰写的 PR 与被归因为 AI 的评审事件关联起来，构建了数据集。' },
      { id:'ar-abs2', page:'P1', cite:'B1',
        en:'The dataset contains 248,641 unique AI-attributed PRs that received at least one AI-attributed review: 45,269 received cross-product review and 208,145 same-product review, with 4,773 receiving both. Cross-product AI-to-AI review occurs in only about 1.6% of identified agent-authored PRs, yet is substantial in absolute terms, and grew by more than two orders of magnitude from 2025-Q1 to 2025-Q3.',
        cn:'数据集包含 <b>248,641</b> 个被归因为 AI 撰写、且至少收到一次 AI 评审的 PR：其中 <b>45,269</b> 个收到<b>跨产品</b>评审，<b>208,145</b> 个收到<b>同产品</b>评审，4,773 个两者都有。跨产品的 AI-to-AI 评审只占已识别智能体撰写 PR 的约 <b>1.6%</b>，但绝对量很可观，且从 2025 年 Q1 到 Q3 增长了<b>两个数量级以上</b>。' }
    ]},
    { id:'ar-s1', no:'1', en:'Introduction and Research Questions', cn:'引言与两个研究问题', page:'P1–P2', paras:[
      { id:'ar-p11', page:'P2',
        en:'Together these roles form what the authors call closed-loop AI review. The term is used in an observable sense only: because the review stream is restricted to AI-attributed events, it means AI occupies both sides of the PR, not that humans were absent. A PR in the dataset may also have received human review that is not observed.',
        cn:'两侧角色合起来构成作者所称的<b>闭环 AI 评审</b>。这个词<b>仅在可观测意义上</b>使用：由于评审数据流只包含被归因为 AI 的事件，它表示「AI 同时占据了 PR 的两侧」，<b>并不表示没有人参与</b>。数据集中的 PR 也可能收到了未被观测到的人工评审。',
        keynote:'留意作者对术语的自我约束。「闭环」不等于「无人」——这是防止读者过度解读的措辞，值得学。' },
      { id:'ar-p12', page:'P2', cite:'B2',
        en:'RQ1 asks how prevalent closed-loop AI review is on GitHub. As AI-generated reviews become common, an increasing share of public code may be evaluated partly by AI, which affects downstream maintenance and any study that treats GitHub review data as evidence of human decision making.',
        cn:'<b>RQ1：闭环 AI 评审在 GitHub 上有多普遍？</b>当 AI 生成的评审变得常见，公共代码中有越来越大的比例可能<b>部分由 AI 评估</b>。这既影响后续维护，也影响任何把 GitHub 评审数据当作「人类决策证据」的研究。' },
      { id:'ar-p13', page:'P2', cite:'B2',
        en:'RQ2 asks how reviewer behavior varies with the author-reviewer setup. If behavior differs across authoring agents, closed-loop review cannot be treated as a single uniform process; maintainers and researchers then need to account for which agent wrote the code and which reviewed it.',
        cn:'<b>RQ2：评审者行为如何随「撰写方—评审方」的组合而变化？</b>如果行为确实因撰写方不同而不同，那么闭环评审<b>就不能被当成单一过程来对待</b>；维护者与研究者必须同时考虑「谁写的」和「谁审的」。' }
    ]},
    { id:'ar-s3', no:'3', en:'Data and Methodology', cn:'数据与方法：两层签名归因', page:'P4–P5', paras:[
      { id:'ar-p31', page:'P4', hit:'b1', cite:'B3',
        en:'Attributing PRs to agents by actor login alone is unreliable: some use generic bot accounts, some post under the human user login with a machine-readable body signature, and some quote other agents text, which misleads body-only rules. The authors therefore use a two-tier signature framework.',
        cn:'<b>仅靠账号名来判断 PR 是哪个智能体写的并不可靠</b>：有的用通用 bot 账号，有的用人类用户的账号但在正文里留机器可读签名，还有的会<b>引用别的智能体的文本</b>，从而误导只看正文的规则。因此作者设计了<b>两层签名框架</b>。',
        keynote:'这是整篇方法论的地基，也是「可信度溯源」在工程上的真实做法：先定义什么算证据，再决定什么能入库。' },
      { id:'ar-p32', page:'P4', cite:'B3',
        en:'S1 is a high-confidence body signature: a regex or fixed substring the agent emits in the PR or comment body, such as the Co-Authored-By trailer from Claude Code, or product URLs from Cursor and OpenAI Codex. S2 is a vendor-controlled account signature: an exact match over a login unambiguously controlled by a vendor. S1 agents require body-level evidence; S2 agents accept body or login evidence. Branch-name prefixes are recorded but never sufficient alone, being user-controllable.',
        cn:'<b>S1（高置信度正文签名）</b>：智能体在 PR 或评论正文中留下的正则或固定子串，例如 Claude Code 的 Co-Authored-By 尾注，或 Cursor、OpenAI Codex 的产品 URL。<b>S2（厂商控制的账号签名）</b>：对某个明确由厂商控制的账号做精确匹配。S1 类智能体<b>必须有正文级证据</b>；S2 类可接受正文或账号证据。分支名前缀会被记录，但<b>永远不足以单独作为依据</b>——因为它由用户自行控制。',
        table:{ title:'两层签名框架的证据门槛', rows:[
          ['S1 · 正文签名','必须命中正文中的签名串，账号名不算'],
          ['S2 · 厂商账号','账号名或正文签名，命中其一即可'],
          ['分支名前缀','仅记录，单独出现时不予采信']
        ]} },
      { id:'ar-p33', page:'P5', hit:'b2', cite:'B4',
        en:'Every candidate is scored against each agent signature set, and an entry is emitted only where evidence meets that agent inclusion floor. Candidates meeting no floor are quarantined to a separate file with a recorded reason. Quarantine is negligible on the review streams, about 0.01% of each, but substantial on the author stream, where 1,733,535 of 4,563,819 candidate PRs are quarantined, 96.9% of them as branch-name-only matches.',
        cn:'每个候选事件都会对照各智能体的签名集打分，<b>只有证据达到该智能体的准入下限时才会入库</b>。任何达不到下限的候选都被<b>隔离（quarantine）</b>到单独文件，并记录原因。隔离率在评审侧微不足道（各约 <b>0.01%</b>），但在撰写侧很高：<b>4,563,819</b> 个候选 PR 中有 <b>1,733,535</b> 个被隔离（<b>38.0%</b>），其中 <b>96.9%</b> 的原因是「只匹配到分支名」。',
        keynote:'38% 被隔离说明一件事：作者宁可少统计，也不愿把证据不足的数据算进来。所有绝对数因此都应读作<b>下界</b>。' }
    ]},
    { id:'ar-s4', no:'4', en:'RQ1: Prevalence and Composition', cn:'RQ1 结果：规模、增长与谁审谁', page:'P6–P8', paras:[
      { id:'ar-p41', page:'P6', hit:'b3', cite:'B5',
        en:'Of the 2,830,284 agent-authored PRs identified, 248,641 or 8.8% received at least one AI review. Activity was negligible through 2025-Q1 with 57 cross-product and 40 same-product PRs, then increased by over two orders of magnitude by 2025-Q3, reaching 25,492 cross- and 57,080 same-product PRs. Counts are read as lower bounds and percentages as conditioned on signature attribution.',
        cn:'在识别出的 <b>2,830,284</b> 个智能体撰写 PR 中，<b>248,641</b> 个（<b>8.8%</b>）至少收到一次 AI 评审。2025 年 Q1 之前活动量微乎其微（跨产品 57 个、同产品 40 个），到 Q3 增长超过两个数量级，达到跨产品 <b>25,492</b>、同产品 <b>57,080</b>。所有计数都应读作<b>下界</b>，所有百分比都<b>以签名归因为条件</b>。' },
      { id:'ar-p42', page:'P7',
        en:'OpenAI Codex dominates as author, accounting for 31,601 cross-product PRs or 69.8% of the total. Copilot dominates as reviewer with 21,022 of the 47,259 author-reviewer pairs; the modal pair is Codex authored and Copilot reviewed at 18,114 pairs. CodeRabbit, the only dedicated reviewer-only bot with usable volume, reviews PRs from at least six authoring agents.',
        cn:'撰写侧由 <b>OpenAI Codex</b> 主导：31,601 个跨产品 PR，占总量 <b>69.8%</b>。评审侧由 <b>Copilot</b> 主导：47,259 个「撰写—评审」配对中占 21,022 个；最高频组合是「<b>Codex 写、Copilot 审</b>」，18,114 对。<b>CodeRabbit</b> 是唯一具备可用体量的「纯评审」机器人，它评审来自至少六个撰写方的 PR。' },
      { id:'ar-p43', page:'P8', cite:'B5',
        en:'The same- versus cross-product split is sharply non-uniform, falling into three groups: product-internal authors reviewed mostly by their own product, with Copilot at 95.7% and Amazon Q at 91.8% same-product; balanced, with OpenAI Codex at 54.1%; and cross-product authors reviewed almost entirely by a different product, namely Cursor, Google Jules and Claude Code.',
        cn:'「同产品 vs 跨产品」的分布<b>极不均匀</b>，可分三组：<b>产品内闭环型</b>——主要被自家产品评审（Copilot 95.7%、Amazon Q 91.8% 为同产品）；<b>均衡型</b>——OpenAI Codex 为 54.1%；<b>跨产品型</b>——几乎完全被别家产品评审（Cursor、Google Jules、Claude Code）。',
        table:{ title:'各撰写方的同产品评审占比', rows:[
          ['Copilot','95.7% 同产品（173,957 个 PR）'],
          ['Amazon Q','91.8% 同产品'],
          ['OpenAI Codex','54.1% 同产品（68,848 个 PR）'],
          ['Cursor / Google Jules','0.0% 同产品，全部跨产品'],
          ['Claude Code','0.5% 同产品']
        ]} }
    ]},
    { id:'ar-s5', no:'5', en:'RQ2: Reviewer Behavior', cn:'RQ2 结果：评审者行为的差异', page:'P8–P10', paras:[
      { id:'ar-p51', page:'P8', hit:'b4', cite:'B6',
        en:'Holding the reviewer fixed as CodeRabbit and varying the authoring agent, the comment-category distribution is visibly non-uniform. Copilot- and Devin-authored PRs receive far more potential-issue comments, at 49.0% and 43.9%, and far fewer refactor comments, at 10.5% and 9.7%. Claude Code sits at the opposite end with the highest refactor share at 35.0%.',
        cn:'把评审方固定为 <b>CodeRabbit</b>、只改变撰写方，评论类别的分布<b>明显不均匀</b>。Copilot 与 Devin 撰写的 PR 收到远多的「<b>疑似缺陷</b>」评论（49.0% 与 43.9%），而「<b>重构建议</b>」远少（10.5% 与 9.7%）。Claude Code 处在另一端，重构建议占比最高，达 <b>35.0%</b>。',
        keynote:'同一个评审器，面对不同撰写方产出了不同的评论结构。这是本文最直观的发现。' },
      { id:'ar-p52', page:'P9', cite:'B6',
        en:'The association between authoring agent and comment category is statistically significant but small, with Cramér V of 0.150. The largest single contrast is refactor share: 35.0% on Claude Code PRs versus 10.5% on Copilot PRs, a difference of 24.5 percentage points. The authors make no claim about code quality, since change size, language, repository and configuration may all influence the pattern.',
        cn:'「撰写方」与「评论类别」的关联<b>统计显著但效应很小</b>：Cramér V = <b>0.150</b>。最大的单项差异是重构建议占比：Claude Code 的 PR 为 35.0%，Copilot 的为 10.5%，相差 <b>24.5 个百分点</b>。作者<b>不就代码质量作任何断言</b>，因为改动规模、语言、仓库、配置都可能影响这一结果。',
        keynote:'「显著但效应小」是读实证论文必须抓的一对词。样本量够大时，p 值一定小；真正该看的是 Cramér V、Cliff δ 这类效应量。' },
      { id:'ar-p53', page:'P9',
        en:'For per-PR comment volume, three of four dual-role reviewers show same-product PRs receiving 58% to 65% more comments on average. But the distributions overlap heavily and Cliff delta is small to negligible across all four bots, so the mean-level gap is not a population-wide shift: it is a long right tail of high-comment same-product PRs.',
        cn:'在「每个 PR 的评论条数」上，四个双角色评审器中有三个显示：同产品 PR 平均多收到 <b>58%–65%</b> 的评论。但各分布<b>大量重叠</b>，四个机器人的 Cliff δ 都在「小到可忽略」区间。所以均值上的差距<b>不是整体分布的平移</b>，而是同产品一侧存在一条<b>很长的右尾</b>（少数 PR 评论极多）。' },
      { id:'ar-p54', page:'P10', hit:'b5', cite:'B7',
        en:'Median time from PR creation to first AI review was 1.2 minutes for cross-product pairs and 4.7 minutes for same-product pairs. Counter-intuitively this is the opposite of a product-rubber-stamps-its-own reading. The reviewer-level results suggest the aggregate difference is compositional: fast reviewers such as Gemini Code Assist at 0.5 minutes occur more often in the cross-product set, whereas Copilot, with a median of 17.7 minutes, dominates the same-product set.',
        cn:'从 PR 创建到首次 AI 评审的中位延迟：跨产品配对 <b>1.2 分钟</b>，同产品配对 <b>4.7 分钟</b>。这与「自家产品会给自家放水」的直觉<b>正好相反</b>。按评审器拆开看，这个总体差异是<b>组成性的</b>：延迟短的评审器（如 Gemini Code Assist 中位 0.5 分钟）在跨产品集合里出现得更频繁，而中位 <b>17.7 分钟</b>的 Copilot 主导了同产品集合。',
        keynote:'这是整篇论文最值得学的一段推理：观察到一个反直觉的聚合差异，不急着解释成因果，而是<b>拆开分组，发现是样本构成造成的</b>。' },
      { id:'ar-p55', page:'P11',
        en:'Timestamp completeness also differed substantially: 79.2% of cross-product pairs but only 31.9% of same-product pairs were retained. If availability correlates with reviewer or workflow characteristics, the complete-case estimates may not represent the full populations. The authors therefore interpret the latency comparison descriptively and do not attribute it to product pairing.',
        cn:'时间戳的完整度本身也差异很大：跨产品配对保留了 <b>79.2%</b>，同产品配对只保留了 <b>31.9%</b>。如果「时间戳是否齐全」与评审器或工作流特征相关，那么仅用完整样本得到的估计<b>可能不代表总体</b>。因此作者<b>只把延迟对比当作描述性结果</b>，不将其归因于产品配对。' }
    ]},
    { id:'ar-s7', no:'6', en:'Threats to Validity', cn:'效度威胁：作者自己划的边界', page:'P11–P12', paras:[
      { id:'ar-p71', page:'P11',
        en:'Signature-based identification can undercount agents whose signatures are missing, uncatalogued or removed by vendors. The absence of a signature is not evidence that a PR was not AI-authored: such PRs simply never enter the population. Under-attribution is asymmetric, far lower on the reviewer side where major reviewers post under vendor-controlled logins, than on the author side which depends on body trailers that squash merges may strip.',
        cn:'基于签名的识别会<b>漏计</b>那些签名缺失、未收录或被厂商移除的智能体。<b>没有签名不等于这个 PR 不是 AI 写的</b>——这类 PR 只是从未进入统计总体。漏计还是<b>不对称的</b>：评审侧漏得少（主流评审器用厂商控制的账号发言），撰写侧漏得多（依赖正文尾注，而 squash 合并可能把尾注抹掉）。',
        keynote:'把这一段和摘要里的数字放在一起看：正因为漏计不对称，8.8% 这个比率才必须被理解为「可归因总体内的比率」，而不是「全部 AI 撰写 PR 的比率」。' },
      { id:'ar-p72', page:'P12',
        en:'The RQ2 content measures rely on CodeRabbit self-declared comment categories. These labels describe the tool own output and are not independently validated measures of issue type, severity, correctness or code quality. The study reports observational associations rather than causal effects.',
        cn:'RQ2 的内容度量依赖 <b>CodeRabbit 自己声明的评论类别</b>。这些标签描述的是该工具自身的输出，<b>不是经过独立验证</b>的缺陷类型、严重度、正确性或代码质量度量。全文报告的是<b>观察性关联，而非因果效应</b>。' }
    ]}
  ]
};

const PAPER_LOOKSYNC = {
  title:'LookSync: Large-Scale Visual Product Search System for AI-Generated Fashion Looks',
  titleCN:'LookSync：面向 AI 生成穿搭的大规模视觉商品搜索系统',
  authors:'Pradeep M, Ritesh Pallod, Satyen Abrol, Muthu Raman T, Ian Anderson（Glance）',
  venue:'Glance · 工业界系统论文 · 印度 / 美国 / 日本多市场部署',
  pages:4, cite:'日均 35 万 AI Look · 1200 万商品',
  sections:[
    { id:'ls-abs', no:'', en:'Abstract', cn:'摘要', page:'P1', paras:[
      { id:'ls-abs1', page:'P1',
        en:'Generative AI is reshaping fashion by enabling virtual looks and avatars, which makes it essential to find real products that best match AI-generated styles. The authors present an end-to-end product search system deployed at internet scale, ensuring that AI-generated looks shown to users are matched with the most visually and semantically similar products from an indexed vector space.',
        cn:'生成式 AI 正在改变时尚行业——它让虚拟穿搭和虚拟形象成为可能，于是「<b>为 AI 生成的造型找到最匹配的真实商品</b>」变成一件必须解决的事。作者给出一套已在互联网级规模上线的端到端商品搜索系统，确保呈现给用户的 AI 穿搭能从向量索引空间中匹配到<b>视觉与语义上最相似</b>的商品。' },
      { id:'ls-abs2', page:'P1', cite:'C1',
        en:'The pipeline has four key components: query generation, vectorization, candidate retrieval, and reranking. Quality is evaluated with human-judged mean opinion scores. The system serves more than 350,000 AI Looks per day across global markets covering over 12 million products. Across annotators and categories, CLIP outperformed alternatives by a small relative margin of 3 to 7% in mean opinion score.',
        cn:'这条流水线包含四个关键组件：<b>查询生成、向量化、候选召回、重排序</b>。质量用人工评判的<b>平均主观得分（MOS）</b>来衡量。系统日均服务超过 <b>35 万</b>个 AI Look，覆盖全球市场、超过 <b>1200 万</b>件商品。在多位标注者与多个品类上，CLIP 以 <b>3%–7%</b> 的相对优势领先其他模型。',
        keynote:'注意作者对这 3%–7% 的措辞：绝对数字不大，但在用户感知上带来了明显更好的匹配——这是工业界论文典型的「小指标、大体感」表述。' }
    ]},
    { id:'ls-s2', no:'2', en:'Background: Vision-Language Models', cn:'背景：可选的视觉语言模型', page:'P2', paras:[
      { id:'ls-p21', page:'P2',
        en:'Existing visual search solutions in fashion retail are not tuned for AI-generated outfits that mix styles or create variations absent from inventory. Recent vision-language models such as CLIP, FashionCLIP, Fashion SigLIP and DINOv2 have improved the ability to map image content into high-dimensional embedding spaces where semantic and visual similarity can be measured.',
        cn:'时尚零售现有的视觉搜索方案<b>并未针对 AI 生成的穿搭做调优</b>——那些造型会混搭风格，或产生库存中根本不存在的变体。近年的视觉语言模型（CLIP、FashionCLIP、Fashion SigLIP、DINOv2）显著提升了「把图像内容映射到高维嵌入空间、从而可度量语义与视觉相似度」的能力。' },
      { id:'ls-p22', page:'P2',
        en:'CLIP and SigLIP learn joint image-text representations, making them robust for multi-modal queries, while DINOv2 offers strong self-supervised image features. Although these architectures succeed in research and niche deployments, applying them at scale with millions of products and frequent catalog updates raises operational and performance challenges.',
        cn:'CLIP 与 SigLIP 学习<b>图文联合表示</b>，因而擅长处理多模态查询；DINOv2 提供强大的<b>自监督图像特征</b>。虽然这些架构在研究和小众部署中已被验证，但把它们放到「数百万商品 + 频繁目录更新」的规模下，就会带来<b>运维与性能层面的挑战</b>。' }
    ]},
    { id:'ls-s3', no:'3', en:'The Core Problem: No Exact Match Exists', cn:'核心问题：目录里根本没有精确匹配项', page:'P2', paras:[
      { id:'ls-p31', page:'P2', hit:'c1', cite:'C2',
        en:'Users onboard by uploading selfies, then try their avatars on reference images to get AI looks they can shop. These generated images often contain clothing or accessories that do not exist exactly in the catalog, because the design is unique to the AI generation. The goal is therefore not only to find exact matches when available, but to approximate.',
        cn:'用户上传自拍完成引导，然后把自己的虚拟形象套用到参考图上，得到可直接购买的 AI 穿搭。<b>这些生成图里的服饰或配件往往在商品目录中并不精确存在</b>，因为该设计是 AI 生成时独有的。因此系统的目标不只是「有精确匹配时找到它」，更要能<b>做近似匹配</b>。',
        keynote:'这是整个系统的设计起点：<b>当精确查找在定义上就不可能时，检索问题必须被重新表述为近似匹配问题</b>。这条思路可以迁移到任何「需求本身是模糊的」搜索场景。' }
    ]},
    { id:'ls-s4', no:'4', en:'The Four-Stage Search Pipeline', cn:'四段式检索流水线', page:'P3', paras:[
      { id:'ls-p41', page:'P3', hit:'c2', cite:'C3',
        en:'When the system receives an AI-generated look, it matches it to the most visually and semantically similar products in the indexed vector space through a multi-stage pipeline: query generation, vectorization, candidate retrieval and reranking.',
        cn:'当系统收到一张 AI 生成的穿搭图，它会通过一条多阶段流水线，把它匹配到向量索引空间中视觉与语义上最相似的商品。四个阶段依次是：<b>查询生成 → 向量化 → 候选召回 → 重排序</b>。',
        table:{ title:'四段流水线各自解决什么', rows:[
          ['① 查询生成','LLM 读图，输出分层的结构化商品描述'],
          ['② 向量化','CLIP ViT-H/14 把描述编码进与商品图同一空间'],
          ['③ 候选召回','向量库取最近邻，去重 + 品牌/尺码/价格硬过滤'],
          ['④ 重排序','LLM 按细粒度视觉语义相似度重排 top-k']
        ]} },
      { id:'ls-p42', page:'P3', hit:'c3', cite:'C4',
        en:'Query generation. Reference images extracted from AI-generated looks are passed to a large language model to produce enhanced search queries describing the products being worn. The prompt design is optimized so descriptions capture detailed product characteristics. The output is a structured dictionary mapping each detected product layer to its descriptive query.',
        cn:'<b>① 查询生成。</b>从 AI 穿搭中提取的参考图被送入大语言模型，生成描述「身上穿了什么」的增强检索查询。提示词经过优化，以确保描述能抓住商品的细节特征。输出是一个<b>结构化字典</b>，把每个被识别出的「穿着层」映射到它的描述性查询。',
        formula:'{ outermost_topwear: 男款炭灰色 polo 衫，纯色，带扣领，长袖，平下摆，休闲风\n  bottomwear: 男款藏青色牛仔裤，纯色，直筒，中度水洗，五袋款型，休闲风\n  accessory_1: 男款银色腕表，圆形表盘，金属表带，指针式显示，日常佩戴 }',
        keynote:'把一张图拆成 topwear / bottomwear / accessory 这样的<b>分层结构</b>，是这套系统能做到精准的关键——它把「一张图的模糊相似」变成了「每一层的可比对文本」。' },
      { id:'ls-p43', page:'P3',
        en:'Vectorization. Each query is passed through CLIP, specifically the ViT-H/14 variant trained on LAION-2B. CLIP is a multimodal model aligning text and images in the same vector space, so a text description produces an embedding living in the same space as product image embeddings. Because catalog images were already embedded with CLIP during ingestion, query embeddings can be compared directly against product embeddings.',

  if(DOC.key){

  if(!a) return null;
  for(const s of curPaper().sections){
    const p = s.paras.find(x=>x.id===a.para);
    if(p) return {sec:s, para:p, anchor:a};
  }
  return null;

function setDocMode(m){ DOC.mode = m; redrawDoc(); }
function setDocFs(d){ DOC.fs = Math.max(-1, Math.min(1, DOC.fs + d)); redrawDoc(); toast('字号已调整'); }
function redrawDoc(){
  const body = curBody();
  const keep = body ? body.scrollTop : 0;
  const w = subQ('#docWrap'); if(w) w.innerHTML = docWrapHTML();
  /* 切换模式/字号后重新对齐到高亮段，避免阅读位置漂移 */
  if(DOC.key){ scrollToHit(false); setTimeout(()=>scrollToHit(false), 30); }
  else if(body) body.scrollTop = keep;
}
/* 把目标元素滚到「吸顶工具条正下方」；offset 用工具条实测高度，避免被遮住 */
function scrollToEl(el, smooth, extra){
  const body = curBody();
  if(!body || !el || !el.getBoundingClientRect || !body.getBoundingClientRect) return false;
  const bar = subQ('#docBar');
  const off = (bar && bar.offsetHeight ? bar.offsetHeight : 96) + (extra||14);
  const delta = el.getBoundingClientRect().top - body.getBoundingClientRect().top - off;
  const top = Math.max(0, body.scrollTop + delta);
  if(smooth && body.scrollTo) body.scrollTo({top:top, behavior:'smooth'});
  else body.scrollTop = top;
  return true;
}
function scrollToHit(smooth){ return scrollToEl(subQ('#hitPara'), smooth); }
function scrollToSec(sid){ return scrollToEl(subQ('#sec-'+sid), true, 4); }

let CHAT = {fid:null, msgs:[], typing:false};
function openAssistant(fid, topic){
  const f = F(fid);
  CHAT = {fid:fid, msgs:[], typing:false};
  CHAT.msgs.push({r:'ai', t:'我只读「'+f.name+'」里的资料回答你，答案都会带出处。'+(topic?'<br><br>你正在看「<b>'+topic+'</b>」这一点，想问什么？':'想问什么？')});
  openSub(f.name+' · AI 小助手', '<div id="chatWrap">'+chatHTML()+'</div>', {aiFid:fid, isChat:true});
}
function chatRedraw(){ const w = subQ('#chatWrap'); if(w) w.innerHTML = chatHTML(); const b=curBody(); if(b) b.scrollTop = 99999; }
/* 自由提问入口：读输入框 → 清空 → 走同一条问答链路 */
function sendAsk(){
  const el = subQ('#askInput'); if(!el) return;
  const q = (el.value || '').trim();
  if(!q) return toast('先输入一个问题');
  el.value = '';
  askAI(q);
}
/* 先精确匹配，再用中文二元组重叠做模糊匹配。
   匹配不上时故意落到「如实说没有依据」分支 —— 这是产品要演示的行为，不是兜底失败。 */
function matchAnswer(bank, q){
  if(bank[q]) return bank[q];
  const norm = s => String(s).toLowerCase().replace(/[\s，。？?、！!,.：:；;""''（）()【】]/g,'');
  const nq = norm(q); if(!nq) return null;
  const grams = s => { const g=[]; for(let i=0;i<s.length-1;i++) g.push(s.slice(i,i+2)); return g; };
  const gq = grams(nq);
  let best = null, bestScore = 0;
  Object.keys(bank).forEach(k=>{
    const nk = norm(k);
    if(nk.indexOf(nq)>-1 || nq.indexOf(nk)>-1){ if(bestScore < 1){ best = bank[k]; bestScore = 1; } return; }
    const gk = grams(nk); if(!gk.length) return;
    const hit = gk.filter(g=>gq.indexOf(g)>-1).length;
    const score = hit / gk.length;
    if(score > bestScore){ bestScore = score; best = bank[k]; }
  });
  return bestScore >= 0.5 ? best : null;   /* 命中过半才算同一个问题 */
}
function askAI(q){
  const fid = CHAT.fid;
  CHAT.msgs.push({r:'me', t:q});
  CHAT.typing = true; chatRedraw();
  setTimeout(()=>{
    const bank = ASK_ANSWERS[fid] || {};
    const hit = matchAnswer(bank, q);
    CHAT.typing = false;
    if(hit) CHAT.msgs.push({r:'ai', t:hit.a, cite:hit.cite, src:hit.src});
    else CHAT.msgs.push({r:'ai',
      t:'这个问题在「'+F(fid).name+'」现有的资料里<b>没有直接依据</b>。<br><br>我不会替你编一个答案。两个选择：①我按你已有的知识点给一个推测（会明确标注"推测"）；②我去内置文献库找一篇能回答它的文献加入你的队列。',
      cite:'无匹配来源 · 已如实告知', src:null, nohit:true});
    chatRedraw();
  }, 900);
}

        (m.cite?'<div style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:11px;color:var(--t3);line-height:1.6">'+

  });
  if(CHAT.typing){
    h += '<div style="align-self:flex-start;display:flex;gap:8px;align-items:center">'+
      '<div style="width:26px;height:26px;border-radius:50%;background:#14161A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">🤖</div>'+

    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px">'+
    (ASK_PRESETS[fid]||ASK_PRESETS._default).map(q=>

    '</div>'+
    '<div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 9px 8px 13px;box-shadow:var(--shadow);margin-bottom:10px">'+
      '<input id="askInput" type="text" placeholder="也可以直接输入你的问题…" autocomplete="off" aria-label="输入你的问题" '+
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendAsk()}" '+
        'style="flex:1;min-width:0;border:none;outline:none;font-size:13px;font-family:inherit;color:var(--t1);background:transparent">'+
      '<button class="btn sm" style="flex:0 0 auto;padding:9px 15px" onclick="sendAsk()">发送</button>'+
